# Replaces one instance with a 1:1 copy of another (staging ← production): R2, then D1, with
# scripts/clone-instance.mjs. Everything the target held is gone afterwards; the source is only read
# (its bucket through a read-only R2 token). Run it in the TARGET's GitHub environment: that environment
# names the source (SOURCE_D1_DATABASE_NAME, SOURCE_R2_BUCKET) and holds both R2 tokens. `confirm` must
# be the target database's name. Deploy the target right after: the clone recreates its database, and
# its Workers are bound to the old one until then (a caller chains Deploy after this job).
# `path`, `environment` and `ref` work as in deploy.yml. Settings: docs/self-hosting.md.
name: Clone

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The target's GitHub environment (it is replaced)
        type: string
        required: true
      confirm:
        description: The target's database name, typed, to confirm that it is replaced
        type: string
        required: true
  workflow_call:
    inputs:
      path:
        description: Where this repository is checked out in the calling one (a submodule)
        type: string
        default: "."
      environment:
        description: The target's GitHub environment in the calling repository (it is replaced)
        type: string
        required: true
      confirm:
        description: The target's database name, typed, to confirm that it is replaced
        type: string
        required: true
      ref:
        description: Run this branch, tag or commit of this repository's script instead of the pinned submodule
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      SOURCE_R2_ACCESS_KEY_ID:
        required: false
      SOURCE_R2_SECRET_ACCESS_KEY:
        required: false

# Never together with a deploy of the same instance.
concurrency:
  group: openclapper-deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.path || '.' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_LOCATION: ${{ vars.D1_LOCATION }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      SOURCE_D1_DATABASE_NAME: ${{ vars.SOURCE_D1_DATABASE_NAME }}
      SOURCE_R2_BUCKET: ${{ vars.SOURCE_R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SOURCE_R2_ACCESS_KEY_ID: ${{ secrets.SOURCE_R2_ACCESS_KEY_ID }}
      SOURCE_R2_SECRET_ACCESS_KEY: ${{ secrets.SOURCE_R2_SECRET_ACCESS_KEY }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      # As in deploy.yml: with a ref, this repository in full (itself, or replacing the submodule).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (inputs.path || '.') == '.' && inputs.ref || '' }}
          submodules: ${{ inputs.ref == '' }}

      - name: Source of the submodule
        if: inputs.ref != '' && (inputs.path || '.') != '.'
        id: core
        working-directory: .
        run: |
          url=$(git config -f .gitmodules --get "submodule.${{ inputs.path }}.url")
          repo=$(printf '%s' "$url" | sed -E 's#^(git@github\.com:|https://github\.com/)##; s#\.git$##')
          echo "repository=$repo" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.ref != '' && (inputs.path || '.') != '.'
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ inputs.ref }}
          path: ${{ inputs.path }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ inputs.path || '.' }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.path || '.' }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.path || '.' }}/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # From the runner's package sources; --metadata (the objects' custom metadata) needs rclone 1.59 or later.
      - name: rclone
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q rclone > /dev/null
          v=$(rclone version | sed -nE '1s/^rclone v([0-9]+)\.([0-9]+).*/\1 \2/p')
          set -- $v
          [ "${1:-0}" -gt 1 ] || [ "${2:-0}" -ge 59 ] || { echo "::error::rclone $1.$2 is too old (needs 1.59+ for --metadata)"; exit 1; }
          rclone version | head -1

      - name: Clone
        run: node scripts/clone-instance.mjs

      - name: Summary
        if: success()
        working-directory: .
        run: |
          echo "**${{ inputs.environment }}** is now a copy of \`$SOURCE_D1_DATABASE_NAME\` / \`$SOURCE_R2_BUCKET\` (sessions not copied)." >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy ${{ inputs.environment }} now: its Workers are bound to the database this run deleted." >> "$GITHUB_STEP_SUMMARY"
