# Builds the Android app for a deployment, pointed at its server (the APP_URL variable): expo prebuild
# + Gradle on the GitHub runner, signed with the deployment's own key (scripts/keystore.sh). No Expo
# account. The APK is the run's artifact, deleted after 3 days: download and install it before then.
# Self-hosters run it on their copy of this repository (Actions → Build APK → Run workflow); another
# repository can call it with this one as a submodule (`path`). Setup: docs/self-hosting.md#the-phone.
# variant=staging builds "OpenClapper Staging" (its own package id and clay icon, so it sits next to the
# production app; signed with the same key) for a staging instance's APP_URL. variant=dev builds the
# development client "OpenClapper Dev" instead (debug-signed, its own package id, loads the JavaScript
# from Metro: make mobile), on the same runner setup.
# `environment` and `ref` work as in deploy.yml: the GitHub environment whose variables (APP_URL) and
# secrets (the signing key) to use, and another version of this repository to build than the pinned one.
# The Android SDK, build-tools and NDK are the runner's; local builds (scripts/apk-local.sh) pin theirs in
# docker/android.Dockerfile. When React Native needs another SDK platform or NDK, check both.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: release (the app for APP_URL), staging (the staging app for APP_URL) or dev (the development client for Metro)
        type: choice
        options: [release, staging, dev]
        default: release
      environment:
        description: A GitHub environment whose variables and secrets to use (empty = the repository's)
        type: string
        default: ""
      ref:
        description: A branch, tag or commit to build instead of the one this run starts from (empty = that one)
        type: string
        default: ""
  workflow_call:
    inputs:
      variant:
        description: release, staging or dev
        type: string
        default: release
      path:
        description: Where this repository is checked out in the calling one (a submodule)
        type: string
        default: "."
      environment:
        description: The calling repository's GitHub environment (production, staging…); empty = its repository settings
        type: string
        default: ""
      ref:
        description: Build this branch, tag or commit of this repository instead of the pinned submodule
        type: string
        default: ""
    secrets:
      # Only the release and staging variants use them.
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

concurrency:
  group: openclapper-build-apk-${{ inputs.environment || 'default' }}-${{ inputs.variant || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.path || '.' }}
    env:
      VARIANT: ${{ inputs.variant || 'release' }}
      EXPO_PUBLIC_API_URL: ${{ vars.APP_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPO_NO_GIT_STATUS: "1"
      # Phones are arm64; every other ABI multiplies the native build (and the APK). Variable to override.
      ANDROID_ABIS: ${{ vars.ANDROID_ABIS || 'arm64-v8a' }}
    steps:
      - name: Settings
        working-directory: .
        run: |
          case "$VARIANT" in release|staging|dev) ;; *) echo "::error::variant must be release, staging or dev"; exit 1 ;; esac
          [ "$VARIANT" != dev ] || exit 0 # the development client needs neither a server nor the key
          [ -n "$EXPO_PUBLIC_API_URL" ] || { echo "::error::Set the APP_URL variable to your server, e.g. https://openclapper-api.<subdomain>.workers.dev"; exit 1; }
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Set the $v secret (scripts/keystore.sh prints all four)"; exit 1; }
          done

      # A standard runner has ~14 GB free; Gradle's native build of React Native needs more. Tools this
      # job never uses go first (the Android SDK stays).
      - name: Free disk space
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/julia* || true
          docker image prune -af > /dev/null || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # As in deploy.yml: with a ref, this repository in full (itself, or replacing the submodule).
          ref: ${{ (inputs.path || '.') == '.' && inputs.ref || '' }}
          fetch-depth: ${{ inputs.ref != '' && '0' || '1' }}
          submodules: ${{ inputs.ref == '' }}

      - name: Source of the submodule
        if: inputs.ref != '' && (inputs.path || '.') != '.'
        id: core
        working-directory: .
        run: |
          url=$(git config -f .gitmodules --get "submodule.${{ inputs.path }}.url")
          repo=$(printf '%s' "$url" | sed -E 's#^(git@github\.com:|https://github\.com/)##; s#\.git$##')
          echo "repository=$repo" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.ref != '' && (inputs.path || '.') != '.'
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ inputs.ref }}
          path: ${{ inputs.path }}
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ inputs.path || '.' }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.path || '.' }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.path || '.' }}/pnpm-lock.yaml

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Only the downloads: the transformed artifacts are several GB and quicker to rebuild than to restore.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.path || '.')) }}
          restore-keys: gradle-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ inputs.path || '.' }}/apps/mobile
        run: |
          export GIT_COMMIT=$(git rev-parse --short HEAD)
          version=$(node -p 'require("../../package.json").version')
          if [ "$VARIANT" = dev ]; then
            # The development client: its own name, package id and icon (app.config.ts), debug-signed with
            # the template's fixed debug key (so one dev build updates the last), no bundle inside.
            export APP_VARIANT=development
            task=assembleDebug out=debug name="openclapper-dev-$version-$GIT_COMMIT.apk"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
            task=assembleRelease out=release name="openclapper-$version-$GIT_COMMIT.apk"
            # The staging app: its own name, package id and icon (app.config.ts). Its version code is the
            # commit count, so every build of main is a new version for Play (deploy#10): it needs the full
            # history, which a run with `ref` checks out; a shallow checkout would count 1.
            if [ "$VARIANT" = staging ]; then
              export APP_VARIANT=staging name="openclapper-staging-$version-$GIT_COMMIT.apk"
              export GIT_COMMIT_COUNT=$(git rev-list --count HEAD)
              [ "$GIT_COMMIT_COUNT" -gt 1 ] || { echo "::error::A staging build needs the full history for its version code: run it with \`ref\` (a branch or main)"; exit 1; }
              echo "Version code: $GIT_COMMIT_COUNT (commit count)"
            fi
            # The App Bundle for Play next to the APK for sideloading, from the same build and key.
            task="$task bundleRelease"
          fi
          pnpm exec expo prebuild --platform android --no-install
          (cd android && ./gradlew $task --no-daemon -PreactNativeArchitectures="$ANDROID_ABIS")
          mv "android/app/build/outputs/apk/$out/app-$out.apk" "$RUNNER_TEMP/$name"
          if [ "$VARIANT" != dev ]; then
            aab="${name%.apk}.aab"
            mv android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/$aab"
            # Never hand out a release signed with the debug key (it would not update a real install).
            signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            if "$signer" verify --print-certs "$RUNNER_TEMP/$name" | grep -q "CN=Android Debug"; then echo "::error::The APK is debug-signed"; exit 1; fi
            if jarsigner -verify -verbose -certs "$RUNNER_TEMP/$aab" | grep -q "CN=Android Debug"; then echo "::error::The App Bundle is debug-signed"; exit 1; fi
            rm "$RUNNER_TEMP/release.jks"
            echo "AAB_NAME=$aab" >> "$GITHUB_ENV"
          fi
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      # What Google Play requires of an upload (docs/self-hosting.md, Play Store). The target API level
      # is a hard gate: Play rejects new apps and updates below API 36 since 31 August 2026. The 16 KB
      # page size (native libraries' LOAD segments aligned to 16 KB) is reported for now.
      - name: Play requirements
        if: env.AAB_NAME != ''
        working-directory: .
        run: |
          apk="$RUNNER_TEMP/$APK_NAME"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          target=$("$tools/aapt2" dump badging "$apk" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          code=$("$tools/aapt2" dump badging "$apk" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
          echo "Target API level $target, version code $code" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${target:-0}" -ge 36 ] || { echo "::error::Google Play needs target API level 36 or higher; this build targets ${target:-?}"; exit 1; }
          readelf=$(find "$ANDROID_HOME/ndk" -name llvm-readelf -path '*prebuilt*' 2>/dev/null | sort -V | tail -1)
          [ -n "$readelf" ] || { echo "::warning::No llvm-readelf in the NDK: 16 KB page size not checked"; exit 0; }
          libs=$(mktemp -d) && unzip -q -o "$apk" 'lib/*' -d "$libs" || true
          bad=""
          for so in $(find "$libs" -name '*.so'); do
            for a in $("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }'); do
              [ $((a)) -ge 16384 ] || { bad="$bad $(basename "$so")"; break; }
            done
          done
          if [ -n "$bad" ]; then
            echo "::warning::Native libraries not aligned to 16 KB:$bad"
            echo "Not aligned to 16 KB:$bad" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Every native library is aligned to 16 KB." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Disk
        if: always()
        working-directory: .
        run: df -h /

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ runner.temp }}/${{ env.APK_NAME }}
          retention-days: 3
          compression-level: 0

      # The App Bundle (release and staging): what goes to Google Play (scripts/play-upload.mjs, deploy#11).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.AAB_NAME != ''
        with:
          name: ${{ env.AAB_NAME }}
          path: ${{ runner.temp }}/${{ env.AAB_NAME }}
          retention-days: 3
          compression-level: 0
