# The PR lane: static analysis, typechecks, unit tests and build dry runs on every pull request and on
# every push to main. Nothing is deployed (that stays in the deployment repository). `make check` runs
# the same lane locally (docs/development.md#checks). The ids lint, typecheck, test and build are the
# required status checks of the ruleset on main: rename one only together with the ruleset. audit is
# advisory and not required. Third-party actions are pinned to a commit SHA (the version in the comment).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  EXPO_NO_GIT_STATUS: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Worker runtime types
        run: pnpm -C apps/worker types && pnpm -C apps/admin types
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Worker runtime types
        run: pnpm -C apps/worker types && pnpm -C apps/admin types
      # Vite builds, both Worker dry runs (after the Vite outputs: assets.directory), Expo export.
      - run: pnpm build
      # Advisory until it passes: with the 7-day release cooldown the Expo packages trail the SDK's
      # newest patches by a week, which expo-doctor reports as a failed check (on 2026-10-21: expo
      # ~57.0.30 and expo-constants ~57.0.22). Once it passes, drop continue-on-error so it blocks
      # (#223, docs/development.md#checks). Pinned; bump it like a dependency.
      - name: expo-doctor (advisory)
        continue-on-error: true
        working-directory: apps/mobile
        run: npx -y expo-doctor@1.21.4

  # Advisory, not a required check: known high and critical advisories in the production dependency
  # tree (the lockfile; no install needed). Findings show as a warning and the job stays green.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm audit (advisory)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high || { echo "::warning::pnpm audit reports high or critical advisories, see the log"; exit 1; }
