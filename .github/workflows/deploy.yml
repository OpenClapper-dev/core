# Deploys OpenClapper to a Cloudflare account: migrates D1, then the app Worker (API + Studio) and,
# once its Access application exists, the admin plane. Self-hosters run it on their copy of this
# repository (Actions → Deploy → Run workflow); another repository can call it with this one as a
# submodule (`path`). Every setting comes from the run's GitHub variables and secrets, never from a
# file: docs/self-hosting.md.
#
# `environment` names a GitHub environment of the calling repository (production, staging…): its
# variables and secrets win over the repository's. Environment secrets cannot be handed over by a
# caller, so this job must name the environment itself. Empty: the repository's own settings.
# `ref` deploys another version of this repository than the pinned one (a branch, for staging): it is
# checked out in full instead of the submodule. With `ref`, the steps below come from the ref in the
# caller's `uses:` line and the scripts from `ref`; a staging caller uses `@main` for both.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: A GitHub environment whose variables and secrets to use (empty = the repository's)
        type: string
        default: ""
      ref:
        description: A branch, tag or commit to deploy instead of the one this run starts from (empty = that one)
        type: string
        default: ""
  workflow_call:
    inputs:
      path:
        description: Where this repository is checked out in the calling one (a submodule)
        type: string
        default: "."
      environment:
        description: The calling repository's GitHub environment (production, staging…); empty = its repository settings
        type: string
        default: ""
      ref:
        description: Deploy this branch, tag or commit of this repository instead of the pinned submodule
        type: string
        default: ""
    # All optional here, so that they may come from the environment instead (checked in the first step).
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      # A read-only analytics token for the admin board's Cloudflare section (docs/features/monitoring.md).
      CF_ANALYTICS_TOKEN:
        required: false

# One deploy at a time per instance; two instances do not wait for each other.
concurrency:
  group: openclapper-deploy-${{ inputs.environment || 'default' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.path || '.' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      D1_LOCATION: ${{ vars.D1_LOCATION }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      APP_WORKER_NAME: ${{ vars.APP_WORKER_NAME }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ADMIN_ACCESS_AUD: ${{ vars.ADMIN_ACCESS_AUD }}
      INSTANCE_LABEL: ${{ vars.INSTANCE_LABEL }}
      PBKDF2_ITERATIONS: ${{ vars.PBKDF2_ITERATIONS }}
      AUTH_PROVIDER: ${{ vars.AUTH_PROVIDER }}
      CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
    steps:
      - name: Settings
        working-directory: .
        run: |
          echo "Environment: ${{ inputs.environment || '(repository settings)' }}; version: ${{ inputs.ref || '(pinned)' }}"
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!v}" ] || { echo "::error::Set the $v secret (in the repository or the environment; docs/self-hosting.md)"; exit 1; }
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Run on this repository itself with a ref: check that out, in full. As a submodule with a
          # ref, the next step replaces the submodule.
          ref: ${{ (inputs.path || '.') == '.' && inputs.ref || '' }}
          fetch-depth: ${{ inputs.ref != '' && '0' || '1' }}
          submodules: ${{ inputs.ref == '' }}

      - name: Source of the submodule
        if: inputs.ref != '' && (inputs.path || '.') != '.'
        id: core
        working-directory: .
        run: |
          url=$(git config -f .gitmodules --get "submodule.${{ inputs.path }}.url")
          repo=$(printf '%s' "$url" | sed -E 's#^(git@github\.com:|https://github\.com/)##; s#\.git$##')
          echo "repository=$repo" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.ref != '' && (inputs.path || '.') != '.'
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ inputs.ref }}
          path: ${{ inputs.path }}
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ inputs.path || '.' }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.path || '.' }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.path || '.' }}/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Deploy configs (creates the D1 database and R2 bucket on the first run)
        run: node scripts/deploy-config.mjs --provision

      - name: Migrate D1
        working-directory: ${{ inputs.path || '.' }}/apps/worker
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc

      - name: Deploy the app (API + Studio)
        run: |
          pnpm --filter @openclapper/studio build
          cd apps/worker && pnpm exec wrangler deploy --config wrangler.deploy.jsonc

      # Deployed from the first run: without its Access application's AUD it refuses every request, and
      # the application can then be created on its (existing) hostname.
      - name: Deploy the admin plane
        working-directory: ${{ inputs.path || '.' }}/apps/admin
        run: pnpm exec vite build && pnpm exec wrangler deploy --config wrangler.deploy.jsonc

      # Only with the secret set: the Cloudflare section of the admin board (monitoring). Re-run Deploy to rotate it.
      - name: Cloudflare analytics token for the admin board
        if: env.CF_ANALYTICS_TOKEN != ''
        working-directory: ${{ inputs.path || '.' }}/apps/admin
        run: printf '%s' "$CF_ANALYTICS_TOKEN" | pnpm exec wrangler secret put CF_ANALYTICS_TOKEN --config wrangler.deploy.jsonc

      - name: Admin plane locked
        if: env.ACCESS_TEAM_DOMAIN == '' || env.ADMIN_ACCESS_AUD == ''
        run: echo "::notice::The admin plane refuses every request until ACCESS_TEAM_DOMAIN and ADMIN_ACCESS_AUD are set (docs/self-hosting.md)."
