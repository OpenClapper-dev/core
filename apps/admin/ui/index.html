<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>OpenClapper admin</title>
    <!-- Icons: the production set in builds, the development (green) set on the dev server (VITE_ICON_SET, vite.config.ts). -->
    <link rel="icon" href="/icons/%VITE_ICON_SET%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/%VITE_ICON_SET%/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/%VITE_ICON_SET%/icon-192.png" />
    <!-- The whole admin hostname is behind its Cloudflare Access app: the manifest needs the Access cookie (CF_Authorization). -->
    <link rel="manifest" href="/icons/%VITE_ICON_SET%/manifest.webmanifest" crossorigin="use-credentials" />
    <script>
      // Theme before first paint, like the Studio: localStorage["theme"] = "sun" | "set", else the OS.
      (function () {
        var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
        var o = null;
        try { o = localStorage.getItem("theme"); } catch (e) {}
        document.documentElement.setAttribute("data-theme", o === "sun" || o === "set" ? o : mq && mq.matches ? "set" : "sun");
      })();
    </script>
    <!-- The font and the icons come with @openclapper/ui (bundled); nothing loads from another origin (CSP: public/_headers). -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
